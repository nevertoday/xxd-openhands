<text x="733.0" y="108" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#2B2A27" text-anchor="start">It works in a folder</text>
<text x="733.0" y="140" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#2B2A27" text-anchor="start">files · commands · PRs</text>
<text x="733.0" y="180" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="400" fill="#6D6B67" text-anchor="start">or on a schedule, by itself</text>
<text x="480.0" y="252" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="400" fill="#6D6B67" text-anchor="middle">Every conversation passes these four stops. Whichever machine runs the backend is whose files the agent can reach.</text>
</svg>
